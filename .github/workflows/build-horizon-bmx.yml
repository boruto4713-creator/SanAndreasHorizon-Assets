name: Build Horizon BMX client ASI

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-horizon-bmx.yml"
      - ".github/scripts/patch_custom_vehicles.py"
      - "client/custom_vehicles.ini"
      - "client/README.md"

permissions:
  contents: read

jobs:
  build-client-asi:
    runs-on: windows-2022
    steps:
      - name: Checkout Horizon assets and patch
        uses: actions/checkout@v4

      - name: Checkout pinned upstream ASI source
        uses: actions/checkout@v4
        with:
          repository: YeyoDiego223/samp-custom-vehicles
          ref: f88d8e19ceff350a477925a7bd668353cd305f79
          path: upstream

      - name: Apply Horizon runtime fixes
        shell: pwsh
        run: |
          python .github/scripts/patch_custom_vehicles.py upstream

      - name: Configure 32-bit ASI build
        run: cmake -S upstream/client -B build -A Win32

      - name: Build ASI
        run: cmake --build build --config Release

      - name: Prepare client package
        shell: pwsh
        run: |
          $asi = "build/Release/custom_vehicles.asi"
          if (!(Test-Path $asi)) {
            throw "No se genero custom_vehicles.asi; revisar el registro de compilacion."
          }
          New-Item -ItemType Directory -Force -Path package/models/custom | Out-Null
          Copy-Item $asi package/custom_vehicles.asi
          Copy-Item client/custom_vehicles.ini package/custom_vehicles.ini
          @'
          INSTALACION BMX HORIZON

          Requisito: GTA San Andreas 1.0 US y un ASI Loader compatible.

          1. Cierra GTA San Andreas.
          2. Copia custom_vehicles.asi y custom_vehicles.ini a la carpeta raiz
             donde esta gta_sa.exe.
          3. Inicia GTA. El ASI descargara bmx.dff y bmx.txd desde GitHub
             a models/custom y registrara el reemplazo visual del modelo 481.
          4. La primera prueba debe hacerse con una copia de seguridad de la
             carpeta de GTA. No se modifica gta3.img con esta compilacion.

          Todos los jugadores que quieran ver la BMX personalizada deben
          instalar el ASI y el INI una sola vez. Los modelos se descargan
          desde los enlaces publicos configurados.

          Esta compilacion necesita una prueba dentro del juego antes de
          distribuirse como version estable.
          '@ | Set-Content -Encoding UTF8 package/LEEME.txt
          Compress-Archive -Path package/* -DestinationPath Horizon-BMX-Client.zip -Force

      - name: Upload test package
        uses: actions/upload-artifact@v4
        with:
          name: Horizon-BMX-Client
          path: Horizon-BMX-Client.zip
          if-no-files-found: error
          retention-days: 30
